<!DOCTYPE html><html lang="it"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>ASCII Betta Fish</title>
<style>html,body{margin:0;height:100%;background:#000;overflow:hidden}canvas{display:block;width:100%;height:100%;object-fit:contain}</style></head><body><canvas id="c"></canvas>
<script>
// ASCII Betta Fish - porting JavaScript (versione leggera). Spazio = pausa, R = riparti
const COLS=113,ROWS=103,CW=7,CH=10,W=COLS*CW,H=ROWS*CH,TAU=Math.PI*2,PI=Math.PI,GOLDEN=PI*(3-Math.sqrt(5));
const cv=document.getElementById('c');cv.width=W;cv.height=H;const cx=cv.getContext('2d');
const gl=document.createElement('canvas');gl.width=W>>2;gl.height=H>>2;const gx=gl.getContext('2d');
const {sin,cos,sqrt,pow,abs,exp,floor,atan2,max,min}=Math;
const cl=(x,a=0,b=1)=>x<a?a:x>b?b:x,sm=x=>{x=cl(x);return x*x*(3-2*x)},sp=(t,a,b)=>sm((t-a)/(b-a));
const lerp=(a,b,k)=>[a[0]+(b[0]-a[0])*k,a[1]+(b[1]-a[1])*k,a[2]+(b[2]-a[2])*k];
const unit=v=>{const l=Math.hypot(...v)||1e-9;return[v[0]/l,v[1]/l,v[2]/l]},dot=(a,b)=>a[0]*b[0]+a[1]*b[1]+a[2]*b[2];
const cross=(a,b)=>[a[1]*b[2]-a[2]*b[1],a[2]*b[0]-a[0]*b[2],a[0]*b[1]-a[1]*b[0]];
const WHITE=[1,.98,.94],GOLD=[1,.82,.38],PALE=(c,k)=>lerp(c,WHITE,k);
const PAL=[[[.1,.36,1],[.3,.86,1],[.4,.3,1],[.9,.26,.92],[1,.3,.55]],[[.95,.1,.16],[1,.55,.35],[.9,.08,.14],[1,.3,.08],[1,.58,.1]],
[[.04,.66,.74],[.6,1,.9],[.08,.72,.7],[.98,.84,.14],[1,.96,.58]],[[.14,.84,.36],[.76,1,.62],[1,.86,.92],[1,.44,.66],[.96,.14,.42]],
[[.2,.85,1],[.9,.98,1],[.3,.74,1],[.65,.9,1],[.95,.98,1]],[[1,.5,.1],[1,.9,.7],[.12,.3,1],[.2,.66,1],[.6,.94,1]],
[[.3,.24,1],[.66,.6,1],[.18,1,.52],[.18,.86,1],[.72,.48,1]],[[.94,.96,1],GOLD,[1,.86,.5],[1,.7,.4],[1,.95,.8]]];
const POOLS=["1il!;:","rtfjcvxz=+","aeoun0{}[]<>","08B$#&%Q"];
const LOOP=20,PERIOD=2,BEAT0=.2,TB=[0,2],TT=[2,4.4],TS=[2.6,4.9],TR=[3.2,5.4],T_RISE=[4.2,6.6],T_TURN=[6.6,8.8],T_DIVE=[8.8,11.2],T_BACK=[11.2,13.4],T_HOME=[13.4,15.6],T_LIGHT=6.2,FIN=[16.2,18.2],WSPEED=1.25;
const NOSE=.42,LEN=.8,TAIL_X=NOSE-.97*LEN,PIV=[-.26,-.06],BEATW=TAU/PERIOD,FIN_LAG=.85;
const beat=t=>{const ph=(((t-BEAT0)/PERIOD)%1+1)%1;return ph<.22?sm(ph/.22):1-sm((ph-.22)/.78)};
const flare=t=>beat(t)*(.35+.65*sm((t-TR[1]+.3)/.5)),stroke=t=>.7+.5*flare(t);
const heading=t=>.6+(PI-1.2)*(sp(t,...T_TURN)-sp(t,...T_BACK))+.22*sin(TAU*t/9+.4)+.06*sin(1.1*t);
const height=t=>.24*(sp(t,...T_RISE)-2*sp(t,...T_DIVE)+sp(t,...T_HOME))+.05*sin(.9*t);
function carry(x,y,z,t,lag=0){
  const behind=cl((NOSE-x)/LEN),td=t-.32*behind-lag;
  z+=.05*stroke(t)*pow(max(behind-.25,0),1.5)/.65*sin(5*behind-BEATW*t);
  x-=PIV[0];y-=PIV[1];
  const tip=.22+.05*sin(.7*td+1)+1.7*(height(td+.05)-height(td-.05))/.1,c=cos(tip),s=sin(tip);
  [x,y]=[x*c-y*s,x*s+y*c];const yw=heading(td);
  return[x*cos(yw)-z*sin(yw)+.05*sin(.45*td+.4),y+.02+height(td),x*sin(yw)+z*cos(yw)];
}
// corpo
const KU=[0,.03,.09,.18,.32,.48,.66,.84,1],KH=[.004,.026,.058,.094,.128,.128,.102,.068,.047];
function tall(u){u=cl(u);for(let i=1;i<9;i++)if(u<=KU[i])return KH[i-1]+(KH[i]-KH[i-1])*(u-KU[i-1])/(KU[i]-KU[i-1]);return KH[8]}
const arch=u=>.012*sin(PI*cl(u))-.01*pow(cl(1-u/.2),2),backAt=x=>arch((NOSE-x)/LEN)+tall((NOSE-x)/LEN),bellyAt=x=>arch((NOSE-x)/LEN)-tall((NOSE-x)/LEN);
const bodyPt=(u,th)=>{const h=tall(u);return[NOSE-LEN*u,arch(u)+h*sin(th),h*(.56-.22*u)*cos(th)]};
const NB=3500,BU=[],BT=[],BM=[],BS=[];
{const area=[];let s=0;for(let i=0;i<=2000;i++){s+=tall(i/2000)+.01;area.push(s)}
 for(let i=0;i<NB;i++){const q=(i+.5)/NB*s;let k=0;while(area[k]<q)k++;const u=k/2000,th=(i*GOLDEN)%TAU,sc=.5+.5*cos(u*170+th*8)*cos(u*170-th*8);
  BU.push(u);BT.push(th);BS.push(sc);BM.push(cl(max(sm((.2-u)/.12),sm((-sin(th)-.2)/.6)))*.75+(sc>.78&&u>.2?.4:0))}}
// camera
const EYE=[0,-.25,6],FWD=unit([0,.25,-6]),RGT=unit(cross(FWD,[0,1,0])),UPV=cross(RGT,FWD),VIEW=unit(EYE),KEY=unit([-.5,.62,.6]),HALF=unit([KEY[0]+VIEW[0],KEY[1]+VIEW[1],KEY[2]+VIEW[2]]);
const ASP=W/H,ZOOM=7.4;
function proj(p){const d=[p[0]-EYE[0],p[1]-EYE[1],p[2]-EYE[2]],z=max(dot(d,FWD),.2);return[(.5+dot(d,RGT)/z*ZOOM*.5)*COLS,(.5-dot(d,UPV)/z*ZOOM*.5*ASP)*ROWS,dot(d,FWD)]}
// buffer di punti
const zb=new Float32Array(COLS*ROWS),cLum=new Float32Array(COLS*ROWS),cRGB=new Float32Array(COLS*ROWS*3),cG=new Int16Array(COLS*ROWS);
function plot(s,lum,rgb,glyph){const x=floor(s[0]),y=floor(s[1]);if(x<0||x>=COLS||y<0||y>=ROWS||s[2]<.3)return;const i=y*COLS+x;if(s[2]>=zb[i])return;zb[i]=s[2];cLum[i]=lum;cRGB[i*3]=rgb[0];cRGB[i*3+1]=rgb[1];cRGB[i*3+2]=rgb[2];cG[i]=glyph}
// fin: onde e pieghe
const scallop=(a,n)=>.94+.06*sqrt(abs(cos(n*PI*a)));
function wave(a,r,t,root,big,k){return big*stroke(t)*pow(r,1.3)*sin(root+2.6*r-BEATW*t+.9*(a-.5))+.022*pow(r,1.2)*sin(4.5*TAU*a+1.3*sin(.6*t+k)-1.8*r+k)+.014*pow(r,4)*sin(19*a-3.4*t+2*k)}
const FINS={
 tail:{na:150,nr:44,rays:15,way:[.6,.7],done:TT[1],span:TT,root:a=>[TAIL_X,.04*(2*a-1),0],long:a=>.7*(.9+.1*sin(PI*a))*scallop(a,15),
  dir(a,r,t,g){const sp_=2.5*(.16+.84*g)*(1+.08*flare(t-.25*r));let an=(a-.5)*sp_*(1-.22*r*r)+.07*r*sin(3.2*a-1.3*t)*g;an-=.16*r*r*cos(an);return[-cos(an),sin(an)]},out:(a,r,t)=>wave(a,r,t,5,.17,0)},
 back:{na:70,nr:34,rays:9,way:[.36,.5],done:TS[1],span:TS,sail:1},belly:{na:80,nr:34,rays:11,way:[.34,.58],done:TS[1],span:TS,sail:-1}};
for(const f of[FINS.back,FINS.belly]){const up=f.sail;
 f.X=a=>up>0?-.24*a:.04-.3*a;f.lean0=a=>up>0?.1+.3*a:.08+.26*a;
 f.root=a=>[f.X(a),up>0?backAt(f.X(a))-.012:bellyAt(f.X(a))+.012,.012];
 f.long=a=>(up>0?(.32+.28*a)*sqrt(sin(PI*cl(.14+.72*a))):(.26+.42*a)*sqrt(sin(PI*cl(.12+.74*a))))*scallop(a,f.rays);
 f.dir=(a,r,t,g)=>{const l=1.5+(f.lean0(a)+.6*r-.1*flare(t-.25*r)-1.5)*g+.07*r*sin(3*a-1.3*t+up)*g;return[-sin(l),up*cos(l)]};
 f.out=(a,r,t)=>wave(a,r,t,5*(NOSE-f.X(a))/LEN,.13+.03*(up<0),1.7+up)+.01*r}
function veilPos(f,t,g){const{na,nr}=f,P=new Array(na*nr);
 for(let i=0;i<na;i++){const a=i/(na-1),rt=f.root(a),L=f.long(a),step=L*pow(g,.8)/(nr-1);let x=rt[0],y=rt[1],po=0;
  for(let j=0;j<nr;j++){const r=j/(nr-1),o=f.out(a,r,t)*g;if(j>0){const rise=o-po,flat=sqrt(max(step*step-rise*rise,.36*step*step)),d=f.dir(a,r,t,g);x+=flat*d[0];y+=flat*d[1]}po=o;
   P[i*nr+j]=carry(x,y,rt[2]+o,t,FIN_LAG*L*r)}}return P}
function ribbonPos(k,t,g){const na=100,nr=7,P=[],side=2*k-1;
 for(let i=0;i<na;i++){const s=i/(na-1);for(let j=0;j<nr;j++){const w=j/(nr-1)*2-1,wide=.036*pow(sin(PI*pow(s,.55)),.8)*(.4+.6*g);
  const x=.13-.6*g*(.22*s+.3*s*s)+w*wide,y=bellyAt(.13)+.012-.6*g*(.96*s-.2*s*s)+.3*w*wide,z=side*(.03+.07*s)+.11*pow(s,1.3)*sin(1.4+3.4*s-BEATW*t+2.4*k)+.012*w*sin(9*s-3*t);
  P.push(carry(x,y,z,t,FIN_LAG*.6*g*s))}}return{na,nr,P}}
// colori
let WV=-9,PO=PAL[0],PN=PAL[0];
function shade(way,ia,ib,lum){const on=sm((WV-way)/.2),bd=cl(.85*exp(-pow((WV-way)/.06,2)))*.65,c=lerp(ia,ib,on);return[lerp(c,WHITE,bd),lum+.45*bd]}
function veilInk(p,r){const[,,v0,v1,v2]=p;let c=r<.5?lerp(v0,v1,sm(r/.5)):lerp(v1,v2,sm((r-.5)/.45));return r>.95?lerp(c,PALE(v2,.6),1):c}
const slopeCh=(dx,dy)=>{const a=(atan2(dy,dx)*180/PI+180)%180;return a<25?'-':a<72?'/':a<108?'|':a<155?'\\':'-'};
const flashK=(t,d)=>t>=d?pow(cl(1-(t-d)/.6),2):0;
function drawSheet(P,na,nr,t,g,f,part){
  const S=P.map(proj),area=1;
  for(let i=0;i<na;i++)for(let j=0;j<nr;j++){const k=i*nr+j,i1=max(i-1,0),i2=min(i+1,na-1),j1=max(j-1,0),j2=min(j+1,nr-1);
   const A=P[i2*nr+j],B=P[i1*nr+j],C=P[i*nr+j2],D=P[i*nr+j1];
   let n=unit(cross([A[0]-B[0],A[1]-B[1],A[2]-B[2]],[C[0]-D[0],C[1]-D[1],C[2]-D[2]]));if(dot(n,VIEW)<0)n=[-n[0],-n[1],-n[2]];
   const a=i/(na-1),r=j/(nr-1);
   let lum=.3+.78*pow(cl(dot(n,KEY)),.8)+.4*pow(cl(dot(n,HALF)),16)+.22*sm((r-.86)/.12);
   const way=f.way[0]+f.way[1]*g*r,ia=veilInk(PO,r),ib=veilInk(PN,r);
   let[rgb,l2]=shade(way,ia,ib,lum);lum=l2;rgb=lerp(rgb,WHITE,cl((lum-.95)*.9,0,.55));
   let glyph=-1;
   if(f.rays&&cos(f.rays*TAU*a)>.88&&r>.14){const q=S[i*nr+j2],w=S[i*nr+j1];glyph=slopeCh((q[0]-w[0])*CW,-(q[1]-w[1])*CH).charCodeAt(0);lum=.62+.55*lum;rgb=PALE(rgb,.4)}
   if(g<1&&j==nr-1&&i%3==0){glyph=42;lum=1.3;rgb=WHITE}
   const fl=flashK(t,f.done);if(fl>.05){rgb=lerp(rgb,WHITE,.6*fl);lum+=.35*fl}
   plot(S[k],lum,rgb,glyph)}}
function drawFrame(t){
  zb.fill(1e9);cG.fill(-2);
  const ch=floor((t-T_LIGHT)/PERIOD),L=PAL.length-1;PO=PAL[cl(ch,0,L)];PN=PAL[cl(ch+1,0,L)];WV=ch>=0?(t-T_LIGHT-ch*PERIOD)*WSPEED:-9;
  // corpo, dal naso alla coda
  const edge=pow(cl((t-TB[0])/(TB[1]-TB[0])),1.2),wf=flashK(t,TB[1]);
  for(let i=0;i<NB&&BU[i]<edge;i++){const u=BU[i],th=BT[i],p=carry(...bodyPt(u,th),t),pu=carry(...bodyPt(u+.002,th),t),pt=carry(...bodyPt(u,th+.002),t);
   let n=unit(cross([pu[0]-p[0],pu[1]-p[1],pu[2]-p[2]],[pt[0]-p[0],pt[1]-p[1],pt[2]-p[2]]));if(dot(n,VIEW)<0)n=[-n[0],-n[1],-n[2]];
   let lum=.6+.36*cl(dot(n,KEY))+.55*pow(cl(dot(n,HALF)),20)+.26*pow(1-abs(dot(n,VIEW)),2)+(u>.2?.24*(BS[i]-.5):0);
   const way=abs(u-.22)*LEN,ia=lerp(PO[0],PO[1],BM[i]),ib=lerp(PN[0],PN[1],BM[i]);let[rgb,l2]=shade(way,ia,ib,lum);lum=l2;
   rgb=lerp(rgb,WHITE,cl(lum-1,0,.5));let glyph=-1;
   if(t<TB[1]&&u>edge-.035&&i%2==0){glyph=42;lum=1.3;rgb=WHITE}
   if(wf>.05){rgb=lerp(rgb,WHITE,.7*wf);lum+=.4*wf}
   plot(proj(p),lum,rgb,glyph)}
  // pinne
  let g=sp(t,...TT);if(g>.01){const f=FINS.tail;drawSheet(veilPos(f,t,g),f.na,f.nr,t,g,f)}
  g=sp(t,...TS);if(g>.01){for(const f of[FINS.back,FINS.belly])drawSheet(veilPos(f,t,g),f.na,f.nr,t,g,f)}
  g=sp(t,...TR);if(g>.01){for(let k=0;k<2;k++){const r=ribbonPos(k,t,g);drawSheet(r.P,r.na,r.nr,t,g,{way:[.12,.6],done:TR[1]},0)}}
  // occhi
  if(edge>.12)for(const th of[.42,PI-.42]){const b=bodyPt(.085,th);b[2]+=th<1?.012:-.012;plot(proj(carry(...b,t)),1.3,WHITE,64)}
  // scintille del finale
  for(const tb of FIN){const age=t-tb-.25;if(age<0||age>2.3)continue;const c=carry(-.1,0,0,t);
   for(let i=0;i<70;i++){const y=1-2*(i+.5)/70,rr=sqrt(1-y*y),d=[rr*cos(GOLDEN*i),y,-abs(rr*sin(GOLDEN*i))*.55],sp_=3*(.45+.55*((i*37)%100)/100),k=(1-exp(-1.7*age))/1.7*sp_,life=1.4+.8*((i*53)%100)/100;
    if(age>life)continue;const q=[c[0]+d[0]*k,c[1]+d[1]*k-.07*age*age,c[2]+d[2]*k],s=proj(q);s[2]-=.5;
    const ink=PAL[i%7][3];plot(s,1.3*cl((life-age)/.5),lerp(ink,WHITE,max(0,1-age/.3)),age>life-.6?46:42)}}
  // disegno
  cx.fillStyle='#000';cx.fillRect(0,0,W,H);cx.font='11px Consolas,Menlo,"DejaVu Sans Mono",monospace';cx.textAlign='center';cx.textBaseline='middle';
  for(let y=0;y<ROWS;y++)for(let x=0;x<COLS;x++){const i=y*COLS+x;let ch_=cG[i],L_=cLum[i],b,c;
   if(ch_==-2){ // acqua vuota: bollicine
     continue}
   if(ch_<0){const h=(y*7919+x*104729)%9973,pool=POOLS[cl(floor((L_-.42)*4.6),0,3)];c=pool[(h+floor(t*4+h%11))%pool.length];b=cl(.45+.55*L_/.9,.45,1)}
   else{c=String.fromCharCode(ch_);b=min(L_,1.4)}
   cx.fillStyle=`rgb(${cl(cRGB[i*3]*b)*255|0},${cl(cRGB[i*3+1]*b)*255|0},${cl(cRGB[i*3+2]*b)*255|0})`;cx.fillText(c,x*CW+CW/2,y*CH+CH/2)}
  // bollicine nell'acqua
  cx.fillStyle='rgba(128,189,255,.35)';
  for(let k=0;k<60;k++){const bx=((k*0.6180339)%1+.012*sin(t*(1+k%3)+k))%1,by=(((k*0.7548776)%1)-t*(.02+.05*((k%5)/5))+10)%1,x=floor(bx*COLS),y=floor(by*ROWS);
   if(cG[y*COLS+x]==-2)cx.fillText(k%5>2?'o':'.',x*CW+CW/2,y*CH+CH/2)}
  // alone
  gx.clearRect(0,0,gl.width,gl.height);gx.drawImage(cv,0,0,gl.width,gl.height);
  cx.globalCompositeOperation='lighter';cx.globalAlpha=.7;cx.imageSmoothingEnabled=true;cx.drawImage(gl,0,0,W,H);cx.globalAlpha=1;cx.globalCompositeOperation='source-over';
  cx.font='13px monospace';cx.textAlign='left';cx.fillStyle='rgb(100,112,136)';cx.fillText('@dwcminh.ascii  ·  spazio = pausa  ·  R = riparti',20,H-18);
}
let t=0,last=performance.now(),paused=false;
addEventListener('keydown',e=>{if(e.code=='Space'){paused=!paused;e.preventDefault()}if(e.key=='r'||e.key=='R')t=0});
cv.addEventListener('click',()=>paused=!paused);
function loop(now){const dt=min((now-last)/1000,1/15);last=now;if(!paused){t+=dt;if(t>LOOP)t=0}drawFrame(t);requestAnimationFrame(loop)}
requestAnimationFrame(loop);
</script></body></html>
